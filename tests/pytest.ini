[pytest]
# The repository root is itself the plugin package (it holds __init__.py), so pytest must not treat it as
# a test package: run with -c tests/pytest.ini --rootdir tests (scripts/verify.sh does).
python_files = test_*.py
addopts = --import-mode=importlib -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
